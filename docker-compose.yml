services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "9000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
   
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda

    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092

    ports:
      - "9092:9092"

    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Provisions the click-event topic explicitly instead of letting Redpanda
  # auto-create it on first produce with the cluster default (1 partition).
  # The partition count is the hard ceiling on consumer-group parallelism, so
  # it has to be a declared value rather than a broker default. Idempotent:
  # --if-not-exists makes re-running this a no-op. It never resizes an
  # existing topic — see the README for the manual update-partitions path.
  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: kafka-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - rpk topic create link-clicked --brokers redpanda:9092
        --partitions "$$KAFKA_TOPIC_PARTITIONS" --replicas 1 --if-not-exists
    environment:
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
    restart: "no"

  postgres-primary:
    image: postgres:16
    container_name: postgres-primary
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-urlshortener}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD in .env}
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=5
      -c hot_standby=on
      -c hba_file=/var/lib/postgresql/data/pg_hba.conf
    ports:
      - "5432:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./docker/primary-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d urlshortener"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres-replica:
    image: postgres:16
    container_name: postgres-replica
    environment:
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - replica_data:/var/lib/postgresql/data
      - ./docker/replica-init:/bootstrap:ro
    command: ["bash", "/bootstrap/replica-init.sh"]
    depends_on:
      postgres-primary:
        condition: service_healthy

volumes:
  primary_data:
  replica_data:
events {}

http {
  # host.docker.internal resolves to BOTH an IPv4 (192.168.65.254) and an IPv6
  # (fdc4:f303:9324::254) address inside this container, but the container has
  # no IPv6 route to the host. A statically-resolved upstream therefore tries
  # the AAAA record on every request and fails it with errno 101 (Network
  # unreachable) before falling back to the A record. Whenever
  # proxy_next_upstream's retry also lands on the AAAA record, both attempts
  # fail and the request returns 502.
  # Resolving at runtime through Docker's embedded DNS with ipv6=off keeps the
  # A record only, so nginx never attempts the unreachable address.
  resolver 127.0.0.11 ipv6=off valid=10s;

  # $upstream_addr records which upstream actually served each request, so
  # load-balancer distribution is verifiable directly from the access log
  # instead of inferred. Without it, round-robin behaviour is only observable
  # by reading each service's own stdout.
  log_format lb '$remote_addr [$time_local] "$request" $status $body_bytes_sent upstream=$upstream_addr';
  access_log /var/log/nginx/access.log lb;

  upstream url_service_pool {
    # `zone` is required for runtime `resolve` on an upstream server.
    zone url_service_pool 64k;
    server host.docker.internal:3001 resolve;
    server host.docker.internal:3002 resolve;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://url_service_pool;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }

    error_page 502 /502.json;
    location = /502.json {
      internal;
      default_type application/json;
      return 502 '{"error":"URL Service is currently unavailable"}';
    }
  }
}